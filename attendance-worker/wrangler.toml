# Cloudflare Worker for the class attendance server (free plan).
# Cloudflare dashboard > Workers & Pages > Create > Import a repository, root directory: attendance-worker
name = "cyber-attendance"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# the page talks to https://cyber-attendance.<account>.workers.dev; no preview copies
workers_dev = true
preview_urls = false

# one Durable Object per class (its own SQLite database; requests run one at a time), and one for the
# whole American Corner: the class list, people, instructors and their roles
[[durable_objects.bindings]]
name = "CLASS"
class_name = "ClassRoom"

[[durable_objects.bindings]]
name = "CORNER"
class_name = "Corner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClassRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Corner"]

# nightly backup at 22:00 Sri Lanka time (16:30 UTC), when daily backup is on;
# every minute: the Firebase key queue (does nothing unless it is set up and turned on in Student requests)
[triggers]
crons = ["30 16 * * *", "* * * * *"]

# the Firebase Realtime Database for the key queue (not secret). Its key, the service account JSON file
# (FIREBASE_SERVICE_ACCOUNT; the older database secret FIREBASE_SECRET also works), is set in Cloudflare:
# Settings > Variables and Secrets (type Secret), never here
[vars]
FIREBASE_URL = "https://attendance-whatsap-keyque-default-rtdb.firebaseio.com"
