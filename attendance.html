<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Class Attendance</title>
<meta name="description" content="American Corner Matara Cyber Security class: scan the classroom QR to check in.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--navy:#002868;--red:#BF0A30;--ink:#0b1630;--muted:#5a6478;--line:#e3e7ee;--soft:#f5f7fb;--bg:#ffffff;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;font-size:16px}
a{color:var(--navy)}
[hidden]{display:none!important}
.deco{position:absolute;top:0;left:0;right:0;height:520px;pointer-events:none;z-index:0;overflow:hidden}
.stripes{position:absolute;top:-12vmin;left:-12vmin;width:40vmin;height:40vmin;transform:rotate(-45deg);display:grid;gap:2vmin;align-content:center;opacity:.9}
.stripes i{display:block;height:2vmin;background:var(--red);transform-origin:left;animation:grow 1.4s var(--ease) both}
.stripes i:nth-child(2){animation-delay:.12s}.stripes i:nth-child(3){animation-delay:.24s}.stripes i:nth-child(4){animation-delay:.36s}
.stars{position:absolute;right:max(16px,calc(50% - 574px));top:150px;width:min(22vw,240px);display:grid;grid-template-columns:repeat(5,1fr);gap:1.2vmin;opacity:.12}
.stars svg{width:100%;height:auto;fill:var(--navy);animation:fade 2.4s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slidein{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,40px) 16px 56px}
.brand{display:flex;justify-content:flex-end;align-items:center;gap:clamp(10px,2vw,20px);animation:fade .8s ease both}
.brand svg,.brand img{height:clamp(30px,4.4vw,50px);width:auto;display:block}
.brand img{border-radius:6px}
.brand svg{box-shadow:0 1px 3px rgba(0,0,0,.15)}
.home{margin-right:auto;font-family:'Outfit';font-weight:600;text-decoration:none;color:var(--navy);display:inline-flex;align-items:center;gap:6px;font-size:1rem}
.home svg{height:18px;box-shadow:none}
header{margin:clamp(24px,5vw,52px) 0 clamp(20px,3vw,32px);animation:up .9s var(--ease) both}
.kicker{font-family:'Outfit';font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-size:clamp(.8rem,1.3vw,1rem)}
h1{font-family:'Outfit';font-weight:700;color:var(--navy);font-size:clamp(2.4rem,7vw,4.6rem);line-height:1;margin:.25em 0 .2em;letter-spacing:-.02em}
h1 span{color:var(--red)}
h2{font-family:'Outfit';font-weight:600;font-size:clamp(1.25rem,2.4vw,1.6rem);color:var(--navy);margin:0 0 14px}
h3{font-family:'Outfit';font-weight:600;font-size:1.15rem;color:var(--navy);margin:0 0 10px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-family:'Outfit';font-weight:600;font-size:clamp(1rem,2vw,1.15rem);color:var(--muted);background:#fff;transition:all .4s var(--ease)}
.pill i{width:12px;height:12px;border-radius:50%;background:#b8c1d1;flex:none}
.pill.open{color:var(--navy);border-color:var(--navy)}
.pill.open i{background:var(--navy);animation:pulse 1.6s ease infinite}
.pill.closed i{background:var(--red)}
.wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(14px,2.4vw,28px);align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
.card{position:relative;padding:clamp(20px,3vw,32px);border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;animation:up .7s var(--ease) both}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--navy)}
.card.redline::before{background:var(--red)}
.lead{font-size:clamp(1.05rem,2vw,1.25rem);color:var(--muted);line-height:1.45;margin-bottom:18px}
label{display:block;font-family:'Outfit';font-weight:600;color:var(--navy);margin:0 0 6px;font-size:1rem}
.field{margin-bottom:16px}
.hint{font-size:.9rem;color:var(--muted);margin-top:5px;line-height:1.4}
input,select,textarea{width:100%;font:inherit;font-size:1.1rem;padding:13px 14px;border:1.5px solid #cdd5e3;border-radius:12px;background:#fff;color:var(--ink);transition:border-color .25s,box-shadow .25s;min-height:50px}
textarea{min-height:120px;font-size:1rem;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(0,40,104,.12)}
input.code{font-family:'Outfit';font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:1.5rem;text-align:center}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--navy);flex:none}
.check{display:flex;align-items:center;gap:10px;font-family:'DM Sans';font-weight:400;color:var(--ink);margin:10px 0;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Outfit';font-weight:600;font-size:1.1rem;padding:13px 22px;border-radius:12px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;text-decoration:none;min-height:50px;transition:transform .2s var(--ease),background .2s,box-shadow .2s}
.btn:hover{box-shadow:0 8px 20px rgba(0,40,104,.2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.small{font-size:.95rem;padding:8px 14px;min-height:40px;border-radius:10px}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.grow{flex:1 1 180px!important}
.linkbtn{background:none;border:0;font:inherit;color:var(--navy);text-decoration:underline;cursor:pointer;padding:6px 0}
.result{text-align:center;padding:10px 0}
.result svg.mark{width:clamp(110px,26vw,150px);height:auto;animation:pop .6s var(--ease) both}
.result .ok circle{fill:var(--navy)}
.result .bad circle{fill:var(--red)}
.result path{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .6s .35s var(--ease) forwards}
.result .big{font-family:'Outfit';font-weight:700;font-size:clamp(1.7rem,5vw,2.4rem);color:var(--navy);margin:14px 0 6px;line-height:1.15}
.result .bad~.big{color:var(--red)}
.result p{font-size:1.15rem;color:var(--muted);line-height:1.45}
.spinner{width:64px;height:64px;border:6px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
.me-top{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.ring{width:110px;height:110px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--navy);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.2s var(--ease)}
.ring text{font-family:'Outfit';font-weight:700;font-size:22px;fill:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:'Outfit';font-size:1.6rem;color:var(--navy);line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.stat.r b{color:var(--red)}
.dates{display:flex;flex-direction:column;gap:6px}
.dl{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;animation:slidein .4s var(--ease) both}
.chip{display:inline-block;font-family:'Outfit';font-weight:600;font-size:.85rem;padding:4px 10px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.chip.p{background:var(--navy);color:#fff}
.chip.e{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.chip.a{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.chip.x{background:var(--red);color:#fff}
.chip.g{background:var(--soft);color:var(--muted)}
.msg{padding:12px 14px;border-radius:12px;background:var(--soft);color:var(--ink);margin:12px 0;line-height:1.45;font-size:1rem}
.msg.err{background:#fff;border:1.5px solid var(--red);color:var(--red)}
.msg.good{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}
footer{color:var(--muted);font-size:.95rem;text-align:center;border-top:1px solid var(--line);padding-top:20px;margin-top:36px}
/* admin */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -16px 20px;padding:0 16px;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font-family:'Outfit';font-weight:600;font-size:1.02rem;padding:14px 14px 12px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:color .2s,border-color .3s var(--ease)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--red)}
.pane{animation:up .5s var(--ease) both}
.adminbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.adminbar .who{color:var(--muted);font-size:.95rem}
.badge{font-family:'Outfit';font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.live{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(14px,2.4vw,28px);align-items:start}
@media (max-width:860px){.live{grid-template-columns:1fr}}
.qrbox{text-align:center}
.qr{position:relative;width:min(100%,440px);margin:0 auto;aspect-ratio:1;background:#fff;border-radius:14px}
.qr svg{width:100%;height:100%;display:block;transition:opacity .3s}
.qr.off svg{opacity:.08}
.qr .over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Outfit';font-weight:700;color:var(--red);font-size:1.5rem;padding:20px}
.codebig{font-family:'Outfit';font-weight:700;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:.22em;color:var(--navy);margin-top:10px}
.timer{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:1rem;margin-top:4px}
.timer svg{width:28px;height:28px}
.timer circle{fill:none;stroke-width:4}
.count{font-family:'Outfit';font-weight:700;font-size:clamp(3rem,8vw,5rem);color:var(--navy);line-height:1}
.names{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;margin-top:12px}
.names div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--soft);animation:slidein .5s var(--ease) both;font-size:1.05rem}
.names div span{color:var(--muted);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.98rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:'Outfit';font-weight:600;color:var(--navy);background:var(--soft);position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfd}
td.name{white-space:normal;min-width:140px;font-weight:600}
.grid th:first-child,.grid td:first-child{position:sticky;left:0;background:#fff;z-index:2;box-shadow:1px 0 0 var(--line)}
.grid th:first-child{background:var(--soft);z-index:3}
.grid td.c{text-align:center;font-family:'Outfit';font-weight:700}
.grid .P{color:var(--navy)}.grid .E{color:var(--navy);opacity:.6}.grid .A{color:var(--red)}
.seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:12px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.row>.seg{flex:0 1 auto}
.seg button{flex:none}
.seg button{font-family:'Outfit';font-weight:600;font-size:1rem;padding:10px 14px;border:0;background:#fff;color:var(--navy);cursor:pointer;min-height:44px}
.seg button.on{background:var(--navy);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-family:'Outfit';font-weight:700;font-size:2rem;color:var(--navy);line-height:1.1}
.kpi span{color:var(--muted);font-size:.92rem}
.kpi.r b{color:var(--red)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--navy);border-radius:4px;transition:width .9s var(--ease)}
.bar.low i{background:var(--red)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.mt{margin-top:18px}.mb{margin-bottom:14px}
.steps{padding-left:22px;line-height:1.6;font-size:1.02rem}
.steps li{margin-bottom:8px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:2px 6px;border-radius:6px;font-size:.92em;word-break:break-all}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-family:'Outfit';font-weight:600;z-index:50;transition:all .35s var(--ease);max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast.err{background:var(--red)}
.demo{background:var(--red);color:#fff;font-family:'Outfit';font-weight:600;text-align:center;padding:8px 16px;font-size:.95rem;position:relative;z-index:6}
/* projector mode */
body.present .deco,body.present .brand,body.present header,body.present .tabs,body.present .adminbar,body.present footer,body.present .noproj{display:none!important}
body.present main{max-width:none;padding:3vh 4vw}
body.present .live{grid-template-columns:auto 1fr;gap:5vw;align-items:center;min-height:94vh}
body.present .qr{width:min(68vh,46vw)}
body.present .codebig{font-size:7vh}
body.present .timer{font-size:2.2vh}
body.present .live>.card{border:0;animation:none}
body.present .live>.card::before{display:none}
body.present .msg{font-size:2.4vh}
body.present .projtitle{display:block!important}
body.present .count{font-size:14vh}
body.present .names{max-height:52vh}
body.present .names div{font-size:2.4vh}
.projtitle{display:none;font-family:'Outfit';font-weight:700;color:var(--navy);font-size:5vh;line-height:1.1;margin-bottom:2vh}
.projtitle span{color:var(--red)}
@media (max-width:600px){.stripes{width:28vmin;height:28vmin;top:-8vmin;left:-8vmin;gap:1.5vmin}.stripes i{height:1.5vmin}header{margin-top:40px}.stars{display:none}.me-top{flex-direction:column;align-items:stretch}.ring{margin:0 auto}th,td{padding:9px 10px}}
@media print{.deco,.brand,.tabs,.adminbar,footer,.noprint,.demo,.toast{display:none!important}main{padding:0}.card{border:0;padding:0;animation:none}.card::before{display:none}.tblwrap{overflow:visible;border:0}th{position:static}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.result path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="demo" id="demoBar" hidden>Demo mode: data stays on this device only. Instructor &gt; Setup to connect the real server.</div>
<div class="deco" aria-hidden="true"><div class="stripes"><i></i><i></i><i></i><i></i></div><div class="stars" id="stars"></div></div>
<main>
  <div class="brand" id="brand"></div>
  <header>
    <div class="kicker">American Corner Matara · Cyber Security</div>
    <h1>Class <span>Attendance</span></h1>
    <div class="pill" id="pill"><i></i><span>Checking the time…</span></div>
  </header>

  <!-- STUDENT -->
  <section id="studentView">
    <div class="wrap">
      <div class="card" id="stCard"></div>
      <div class="card redline" id="meCard" style="animation-delay:.1s"></div>
    </div>
    <footer>Check-in opens on <span id="winText">Saturdays, 09:00 to 13:00</span> (Sri Lanka time). <button class="linkbtn" id="toAdmin">Instructor</button></footer>
  </section>

  <!-- ADMIN -->
  <section id="adminView" hidden>
    <div id="loginBox" class="card" style="max-width:520px">
      <h2>Instructor login</h2>
      <form id="loginForm" autocomplete="on">
        <input type="text" name="username" value="instructor" autocomplete="username" hidden>
        <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required minlength="8"></div>
        <button class="btn wide" id="loginBtn">Log in</button>
      </form>
      <div id="loginMsg"></div>
      <p class="hint mt"><button class="linkbtn" id="toSetup">Setup and demo</button> · <button class="linkbtn" id="toStudent">Back to check-in</button></p>
    </div>
    <div id="panel" hidden>
      <div class="adminbar"><div><div class="badge">Instructor</div><div class="who" id="who"></div></div>
        <div class="row"><button class="btn small ghost" id="refresh">Refresh</button><button class="btn small ghost" id="logout">Log out</button></div></div>
      <nav class="tabs" id="tabs"></nav>
      <div id="paneBox"></div>
    </div>
    <div id="setupBox" hidden></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
/* Paste the Google Apps Script Web app URL between the quotes so every phone finds the server without the QR.

/* ---------- brand ---------- */
function usFlag(){
  const W=1.9,H=1,cw=.76,ch=.5385;
  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="United States flag">';
  for(let i=0;i<13;i++)s+='<rect x="0" y="'+(i/13)+'" width="'+W+'" height="'+(1/13+.001)+'" fill="'+(i%2?'#ffffff':'#bf0a30')+'"/>';
  s+='<rect width="'+cw+'" height="'+ch+'" fill="#002868"/>';
  const star=(cx,cy,r)=>{let p=[];for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.382:r;p.push((cx+rr*Math.cos(a)).toFixed(4)+','+(cy+rr*Math.sin(a)).toFixed(4));}return '<polygon points="'+p.join(' ')+'" fill="#fff"/>';};
  for(let row=0;row<9;row++)for(let j=0;j<11;j++){if((row%2===0&&j%2===0)||(row%2===1&&j%2===1))s+=star(.063*(j+1),.054*(row+1),.0308);}
  return s+'</svg>';
}

const SHA=(()=>{const K=[],H0=[];let n=2,c=0;const fr=x=>(x-Math.floor(x))*4294967296|0;

  const ror=(x,r)=>(x>>>r)|(x<<(32-r));
  function hash(bytes){const b=Array.from(bytes),l=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);
    for(let i=7;i>=0;i--)b.push(i>=4?0:(l>>>(i*8))&255);
    let H=H0.slice();const w=new Array(64);
    for(let j=0;j<b.length;j+=64){
      for(let i=0;i<16;i++)w[i]=(b[j+4*i]<<24)|(b[j+4*i+1]<<16)|(b[j+4*i+2]<<8)|b[j+4*i+3];
      for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];w[i]=(w[i-16]+(ror(x,7)^ror(x,18)^(x>>>3))+w[i-7]+(ror(y,17)^ror(y,19)^(y>>>10)))|0}
      let [a,bb,cc,d,e,f,g,h]=H;
      for(let i=0;i<64;i++){const t1=(h+(ror(e,6)^ror(e,11)^ror(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((ror(a,2)^ror(a,13)^ror(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
      H=[H[0]+a|0,H[1]+bb|0,H[2]+cc|0,H[3]+d|0,H[4]+e|0,H[5]+f|0,H[6]+g|0,H[7]+h|0]}
    const out=[];H.forEach(v=>out.push((v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255));return out}
  const utf8=s=>Array.from(new TextEncoder().encode(s));
  function hmac(key,msg){let k=utf8(key);if(k.length>64)k=hash(k);while(k.length<64)k.push(0);
    return hash(k.map(x=>x^0x5c).concat(hash(k.map(x=>x^0x36).concat(utf8(msg)))))}
  return {hash,hmac,hex:s=>hash(utf8(s)).map(x=>('0'+x.toString(16)).slice(-2)).join('')};
})();
const CODE_ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function codeFor(key,slot){const b=SHA.hmac(key,'att:'+slot);let o='';for(let i=0;i<6;i++)o+=CODE_ALPHABET[b[i]&31];return o}
function randHex(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>('0'+x.toString(16)).slice(-2)).join('')}

const params=new URLSearchParams(location.search);
function scriptIdFrom(v){v=String(v||'').trim();if(v==='demo')return 'demo';const m=v.match(/\/s\/([A-Za-z0-9_-]{20,})\//)||v.match(/^([A-Za-z0-9_-]{20,})$/);return m?m[1]:''}

const isDemo=()=>SID==='demo';
let demoCore=null;
async function loadDemo(){
  if(demoCore)return demoCore;
  const src=await (await fetch('attendance-server.js',{cache:'no-store'})).text();
  const make=new Function(src+'\nreturn AttendanceCore;')();
  const load=()=>{try{return JSON.parse(store.get('att-demo')||'{}')}catch(e){return {}}};
  const save=d=>store.set('att-demo',JSON.stringify(d));
  const env={
    now:()=>Date.now()+(load().shift||0),
    read:t=>((load().T||{})[t]||[]).map(r=>Object.assign({},r)),
    append:(t,o)=>{const d=load();d.T=d.T||{};(d.T[t]=d.T[t]||[]).push(Object.assign({},o));save(d)},
    write:(t,rows)=>{const d=load();d.T=d.T||{};d.T[t]=rows.map(r=>Object.assign({},r));save(d)},
    getProp:k=>{const v=(load().P||{})[k];return v==null?null:v},
    setProp:(k,v)=>{const d=load();d.P=d.P||{};d.P[k]=v;save(d)},
    cacheGet:k=>{const c=(load().C||{})[k];return c&&c[1]>Date.now()?c[0]:null},
    cachePut:(k,v,s)=>{const d=load();d.C=d.C||{};d.C[k]=[v,Date.now()+s*1000];save(d)},
    cacheDel:k=>{const d=load();if(d.C)delete d.C[k];save(d)},
    hmac:(k,m)=>SHA.hmac(k,m),sha256:s=>SHA.hex(s),random:()=>randHex(20),lock:f=>f()
  };
  demoCore={handle:r=>make(env).handle(r),setPassword:p=>make(env).setPassword(p),load,save};
  return demoCore;
}
async function api(body){
  if(!SID)throw new Error('Attendance server is not set up yet.');
  if(isDemo()){const c=await loadDemo();await new Promise(r=>setTimeout(r,350));return JSON.parse(JSON.stringify(c.handle(body)))}
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),30000);
  try{
    const r=await fetch('https://script.google.com/macros/s/'+SID+'/exec',{method:'POST',body:JSON.stringify(body),signal:ctl.signal,redirect:'follow'});
    const j=await r.json();return j;
  }catch(e){throw new Error(e.name==='AbortError'?'The server took too long. Try again.':'Could not reach the attendance server. Check your internet and try again.')}
  finally{clearTimeout(t)}
}

function localParts(ms){const tz=(STATUS&&STATUS.window.tzOffset)||330;const d=new Date(ms+tz*60000);return {y:d.getUTCFullYear(),m:d.getUTCMonth(),d:d.getUTCDate(),wd:d.getUTCDay(),hh:d.getUTCHours(),mm:d.getUTCMinutes()}}
const p2=n=>(n<10?'0':'')+n;
function niceDate(iso,withDay=true){const [y,m,d]=iso.split('-').map(Number);const wd=new Date(Date.UTC(y,m-1,d)).getUTCDay();return (withDay?DAYS[wd].slice(0,3)+' ':'')+d+' '+MON[m-1]}
function niceMs(ms){const t=localParts(ms);return DAYS[t.wd]+' '+t.d+' '+MON[t.m]+', '+p2(t.hh)+':'+p2(t.mm)}
function windowText(w){const names=w.days.map(d=>DAYS[d]+'s');return (names.length>1?names.slice(0,-1).join(', ')+' and '+names[names.length-1]:names[0])+', '+w.start+' to '+w.end}

async function doCheckin(){

function compute(){
  const D=DATA,today=D.today;
  const held=D.days.filter(d=>d.status==='held'&&d.date<=today).map(d=>d.date).sort();
  const att={},exc={},first={};
  D.attendance.forEach(r=>{att[r.id+'|'+r.date]=r;if(!first[r.id]||r.date<first[r.id])first[r.id]=r.date});
  D.excuses.forEach(r=>{exc[r.id+'|'+r.date]=r});
  const th=RPT.th/100;
  const rows=D.students.map(s=>{
    const f=[first[s.id],s.added].filter(Boolean).sort()[0]||today,start=D.settings.fromFirst?f:'';
    const days=held.filter(d=>d>=start);
    let P=0,E=0;const cells={};
    held.forEach(d=>{const a=att[s.id+'|'+d],e=exc[s.id+'|'+d];cells[d]=d<start?'-':a?'P':e?'E':'A';if(d>=start){if(a)P++;else if(e)E++}});
    const n=days.length,raw=n?P/n:null,adj=n?(P+E)/n:null;
    const res=n===0?'none':raw>=th-1e-9?'pass':(RPT.useExc&&adj>=th-1e-9)?'excused':'below';
    return {s,P,E,A:n-P-E,n,raw,adj,res,cells};
  }).sort((a,b)=>a.s.name.localeCompare(b.s.name));
  return {held,rows,att,exc};
}

function propEsc(v,key){let s='';for(const ch of String(v==null?'':v)){const c=ch.codePointAt(0);
  if(ch==='\\')s+='\\\\';else if(ch==='\n')s+='\\n';else if(ch==='\r')s+='\\r';else if(ch==='\t')s+='\\t';else if(key&&/[=: #!]/.test(ch))s+='\\'+ch;
  else if(c<32||c>126){const u=c>0xffff?String.fromCodePoint(c):ch;for(let i=0;i<u.length;i++)s+='\\u'+('000'+u.charCodeAt(i).toString(16)).slice(-4)}else s+=ch}

  C.held.forEach(d=>{let pc=0;C.rows.forEach(r=>{const a=C.att[r.s.id+'|'+d],e=C.exc[r.s.id+'|'+d];if(a){pc++;P('attendance.'+d+'.'+r.s.id,'present '+a.time+(a.method==='admin'?' admin':''))}else if(e)P('attendance.'+d+'.'+r.s.id,'excused '+(e.reason||''));else if(r.cells[d]==='A')P('attendance.'+d+'.'+r.s.id,'absent')});P('day.'+d+'.present',pc);L.push('')});

function nextClassDate(){const w=DATA.settings;let ms=nowMs();for(let i=0;i<8;i++){const t=localParts(ms+i*86400000);if(w.days.includes(t.wd))return t.y+'-'+p2(t.m+1)+'-'+p2(t.d)}return DATA.today}
function paneExcuses(box){
  const st=DATA.students.slice().sort((a,b)=>a.name.localeCompare(b.name)),name={};st.forEach(s=>name[s.id]=s.name);
  const list=DATA.excuses.slice().sort((a,b)=>a.date<b.date?1:-1);
  box.innerHTML=`<div class="pane split"><div class="card" style="animation:none"><h3>Mark an excused absence</h3><p class="hint mb">When a student tells you before (or after) they miss a class. Excused days count toward the pass mark when "Count excused absences" is on.</p>
    <form id="exForm"><div class="field"><label for="exSt">Student</label><select id="exSt" required>${st.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.id)})</option>`).join('')}</select></div>
    <div class="field"><label for="exDate">Class day</label><input id="exDate" type="date" required value="${nextClassDate()}"></div>
    <div class="field"><label for="exWhy">Reason</label><input id="exWhy" maxlength="160" placeholder="e.g. School exam, informed on WhatsApp"></div>
    <button class="btn" ${st.length?'':'disabled'}>Save excuse</button></form></div>
   <div><h3>Excuses (${list.length})</h3><div class="dates">${list.map(e=>`<div class="dl"><span><b>${esc(name[e.id]||e.id)}</b><br><span class="hint">${esc(niceDate(e.date))}${e.reason?' · '+esc(e.reason):''}</span></span><button class="btn small ghost" data-id="${esc(e.id)}" data-d="${esc(e.date)}">Remove</button></div>`).join('')||'<p class="hint">No excuses yet.</p>'}</div></div></div>`;
  $('#exForm').onsubmit=async e=>{e.preventDefault();const r=await adminCall({action:'excuse',id:$('#exSt').value,date:$('#exDate').value,excused:true,reason:$('#exWhy').value});if(r.ok){toast('Excuse saved');loadData()}else toast(r.message,true)};
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const r=await adminCall({action:'excuse',id:b.dataset.id,date:b.dataset.d,excused:false});if(r.ok){toast('Removed');loadData()}else toast(r.message,true)});
}

/* Class days */
function paneDays(box){
  const counts={};DATA.attendance.forEach(r=>counts[r.date]=(counts[r.date]||0)+1);
  const days=DATA.days.slice().sort((a,b)=>a.date<b.date?1:-1);
  box.innerHTML=`<div class="pane split"><div class="card" style="animation:none"><h3>Add or cancel a day</h3><p class="hint mb">A class day is added on its first check-in. Add one by hand for a class nobody checked in to. Cancel a day (holiday, no class) so it does not count, and check-in stays closed that day.</p>
    <form id="dForm"><div class="field"><label for="dDate">Date</label><input id="dDate" type="date" required value="${nextClassDate()}"></div>
    <div class="field"><label for="dNote">Note</label><input id="dNote" maxlength="120" placeholder="e.g. Poya holiday"></div>
    <div class="row"><button class="btn" data-s="held">Class day</button><button class="btn ghost" data-s="cancelled">Cancelled</button></div></form></div>
   <div><div class="tblwrap"><table><thead><tr><th>Day</th><th>Status</th><th class="num">Check-ins</th><th></th></tr></thead><tbody>
   ${days.map(d=>`<tr><td>${esc(niceDate(d.date))}${d.note?'<br><span class="hint">'+esc(d.note)+'</span>':''}</td><td>${d.status==='cancelled'?'<span class="chip a">Cancelled</span>':d.date>DATA.today?'<span class="chip g">Upcoming</span>':'<span class="chip p">Held</span>'}</td><td class="num">${counts[d.date]||0}</td><td><button class="btn small ghost" data-d="${d.date}" data-s="${d.status==='cancelled'?'held':'cancelled'}">${d.status==='cancelled'?'Restore':'Cancel'}</button></td></tr>`).join('')||'<tr><td colspan="4" class="hint">No class days yet.</td></tr>'}
   </tbody></table></div></div></div>`;
  $('#dForm').querySelectorAll('button').forEach(b=>b.onclick=async e=>{e.preventDefault();if(!$('#dDate').value)return;const r=await adminCall({action:'day',date:$('#dDate').value,status:b.dataset.s,note:$('#dNote').value});if(r.ok){toast('Saved');loadData()}else toast(r.message,true)});
  box.querySelectorAll('tbody [data-d]').forEach(b=>b.onclick=async()=>{if(b.dataset.s==='cancelled'&&counts[b.dataset.d]&&!confirm('Cancel this day? Its '+counts[b.dataset.d]+' check-ins stay saved but will not count.'))return;const r=await adminCall({action:'day',date:b.dataset.d,status:b.dataset.s});if(r.ok){toast('Saved');loadData()}else toast(r.message,true)});
}

/* Log */
let logFilter='rejected';
function paneLog(box){
  const rows=DATA.log.slice().reverse().filter(r=>logFilter==='all'||(logFilter==='rejected'?r.result==='rejected':r.result!=='rejected'));
  box.innerHTML=`<div class="pane"><p class="hint mb">Every check-in try and admin change, newest first. Watch for one phone trying many IDs, or names that do not match.</p>
   <div class="row mb"><div class="seg" id="lSeg">${[['rejected','Rejected'],['ok','Accepted'],['all','All']].map(([k,l])=>`<button data-v="${k}" class="${logFilter===k?'on':''}">${l}</button>`).join('')}</div></div>
   <div class="tblwrap"><table><thead><tr><th>When</th><th>What</th><th>ID</th><th>Name</th><th>Result</th><th>Detail</th><th>Phone</th></tr></thead><tbody>
   ${rows.slice(0,300).map(r=>`<tr><td>${esc(niceDate(r.date,false))} ${esc(r.time)}</td><td>${esc(r.action)}</td><td>${esc(r.id)}</td><td>${esc(r.name)}</td><td>${r.result==='rejected'?'<span class="chip a">rejected</span>':r.result==='duplicate'?'<span class="chip e">repeat</span>':'<span class="chip p">'+esc(r.result)+'</span>'}</td><td>${esc(r.detail)}</td><td><span class="hint">${esc((r.device||'').slice(0,6))}</span></td></tr>`).join('')||'<tr><td colspan="7" class="hint">Nothing here.</td></tr>'}
   </tbody></table></div></div>`;
  $('#lSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;logFilter=b.dataset.v;renderPane()};
}

/* Settings */
function paneSettings(box){
  const s=DATA.settings;
  box.innerHTML=`<div class="pane split"><div class="card" style="animation:none"><h3>Check-in window</h3><p class="hint mb">Uses Google's clock in ${esc(s.tzName)}, not the phone's clock.</p>
    <form id="setForm"><label>Days</label><div class="row mb">${DAYS.map((d,i)=>`<label class="check" style="margin:4px 10px 4px 0"><input type="checkbox" name="day" value="${i}" ${s.days.includes(i)?'checked':''}>${d.slice(0,3)}</label>`).join('')}</div>
    <div class="row"><div class="field grow"><label for="sStart">Opens</label><input id="sStart" type="time" value="${esc(s.start)}" required></div><div class="field grow"><label for="sEnd">Closes</label><input id="sEnd" type="time" value="${esc(s.end)}" required></div></div>
    <h3 class="mt">Checks</h3>
    <label class="check"><input type="checkbox" id="sCode" ${s.requireCode?'checked':''}>Must scan the live QR in the room</label>
    <label class="check"><input type="checkbox" id="sDev" ${s.oneDevice?'checked':''}>One student per phone per day</label>
    <label class="check"><input type="checkbox" id="sReg" ${s.selfRegister?'checked':''}>New students can register on first check-in</label>
    <label class="check"><input type="checkbox" id="sFirst" ${s.fromFirst?'checked':''}>Count each student's classes from the day they joined</label>
    <button class="btn mt">Save settings</button></form></div>
   <div class="card" style="animation:none"><h3>Server</h3><p class="mb">${isDemo()?'Demo mode on this device.':'Google Apps Script, ID ending <code>…'+esc(SID.slice(-8))+'</code>.'}</p>
    <button class="btn ghost" onclick="location.hash='#setup'">Setup and demo</button></div></div>`;
  $('#setForm').onsubmit=async e=>{e.preventDefault();
    const settings={days:[...box.querySelectorAll('input[name=day]:checked')].map(x=>+x.value),start:$('#sStart').value,end:$('#sEnd').value,requireCode:$('#sCode').checked,oneDevice:$('#sDev').checked,selfRegister:$('#sReg').checked,fromFirst:$('#sFirst').checked};
    const r=await adminCall({action:'settings',settings});if(r.ok){toast('Settings saved');loadData()}else toast(r.message,true)};
}

/* Setup + demo */
function renderSetup(){
  const page=new URL('attendance.html',location.href).toString().split('?')[0];
  $('#setupBox').innerHTML=`<div class="split">
   <div class="card"><h2>Connect the free server</h2><p class="lead">Attendance is saved in a Google Sheet that you own. A small Google Apps Script checks every check-in. No paid hosting.</p>
    <ol class="steps"><li>Open <a href="https://sheets.new" target="_blank" rel="noopener">sheets.new</a> (a new Google Sheet). Name it <b>Cyber Class Attendance</b>.</li>
    <li>In the Sheet: <b>Extensions › Apps Script</b>. Delete what is in <code>Code.gs</code>, then paste the server code. <button class="btn small" id="copyCode">Copy server code</button> <a href="attendance-server.js" target="_blank" rel="noopener">view</a></li>
    <li>Save, then <b>Deploy › New deployment</b>. Type: <b>Web app</b>. Execute as: <b>Me</b>. Who has access: <b>Anyone</b>. Deploy and allow access.</li>
    <li>Back in the Sheet, reload. Menu <b>Attendance › Set admin password</b> (8+ characters).</li>
    <li>Paste the Web app URL here:</li></ol>
    <form id="srvForm" class="mt"><div class="field"><label for="srv">Web app URL</label><input id="srv" placeholder="https://script.google.com/macros/s/…/exec" value="${SID&&!isDemo()?'https://script.google.com/macros/s/'+esc(SID)+'/exec':''}"></div>
    <div class="row"><button class="btn">Connect</button><button type="button" class="btn ghost" id="toLogin">Instructor login</button></div></form><div id="srvMsg"></div>
    <p class="hint mt">The classroom QR carries the server address, so students need nothing else. To make it work without the QR too (for "My attendance"), put the URL in <code>SERVER_URL</code> at the top of <code>attendance.html</code>.</p></div>
   <div class="card redline"><h2>Try it now</h2><p class="lead">Demo mode runs the same server code inside this browser. Nothing leaves this device.</p>
    <div class="row"><button class="btn red" id="demoOn">${isDemo()?'Restart demo':'Start demo'}</button>${isDemo()?'<button class="btn ghost" id="demoOff">Leave demo</button>':''}</div>
    ${isDemo()?`<h3 class="mt">Pretend time</h3><div class="row"><button class="btn small ghost" data-shift="sat">Saturday 10:00</button><button class="btn small ghost" data-shift="sun">Sunday 10:00</button><button class="btn small ghost" data-shift="real">Real time</button></div>
    <h3 class="mt">Sample class</h3><p class="hint mb">Adds 14 students and 6 past Saturdays so the reports have something to show.</p><button class="btn small" id="seed">Add sample class</button>
    <p class="hint mt">Demo password: <b>demo1234</b>. To test a student check-in, open <a href="${esc(page)}?s=demo" target="_blank" rel="noopener">the student page</a> in another tab and type the code from Live QR.</p>`:''}
    <h3 class="mt">What the checks stop</h3><ul class="steps"><li>Check-ins outside ${esc(STATUS?windowText(STATUS.window):'Saturdays, 09:00 to 13:00')} (server clock).</li><li>Checking in from home: the QR code changes every 30 s.</li><li>Two check-ins for one student on one day.</li><li>One phone checking in several friends.</li><li>Someone using another student's ID with a different name.</li><li>Anyone changing records without the admin password.</li></ul></div></div>`;
  $('#copyCode').onclick=async()=>{try{const t=await (await fetch('attendance-server.js',{cache:'no-store'})).text();await navigator.clipboard.writeText(t);toast('Server code copied')}catch(e){toast('Copy failed. Use "view" and copy by hand.',true)}};
  $('#toLogin').onclick=()=>{location.hash='#admin'};
  $('#srvForm').onsubmit=async e=>{e.preventDefault();const id=scriptIdFrom($('#srv').value);if(!id||id==='demo'){$('#srvMsg').innerHTML='<div class="msg err">That does not look like a Web app URL. It ends with /exec.</div>';return}
    const old=SID;SID=id;$('#srvMsg').innerHTML='<div class="spinner"></div>';
    try{const s=await api({action:'status'});if(!s.ok)throw new Error(s.message);store.set('att-server',SID);STATUS=s;OFFSET=s.now-Date.now();paintPill();TOKEN=null;sess.del('att-token');DATA=null;
      $('#srvMsg').innerHTML='<div class="msg good">Connected. Server time '+esc(s.time)+' Sri Lanka. '+(s.configured?'Admin password is set.':'Now set the admin password in the Sheet (Attendance menu).')+'</div>';$('#demoBar').hidden=true}
    catch(err){SID=old;$('#srvMsg').innerHTML='<div class="msg err">Could not connect: '+esc(err.message)+' Check the URL and that access is "Anyone".</div>'}};
  $('#demoOn').onclick=async()=>{store.del('att-demo');SID='demo';store.set('att-server','demo');demoCore=null;
    try{const c=await loadDemo();c.setPassword('demo1234');TOKEN=null;sess.del('att-token');DATA=null;$('#demoBar').hidden=false;await refreshStatus();toast('Demo ready. Password demo1234');renderSetup()}
    catch(e){toast('Demo needs the page served from GitHub Pages or a web server.',true)}};
  const off=$('#demoOff');if(off)off.onclick=()=>{store.del('att-demo');store.del('att-server');SID=scriptIdFrom(SERVER_URL);TOKEN=null;sess.del('att-token');DATA=null;$('#demoBar').hidden=true;refreshStatus();renderSetup()};
  $('#setupBox').querySelectorAll('[data-shift]').forEach(b=>b.onclick=async()=>{const c=await loadDemo(),d=c.load();
    if(b.dataset.shift==='real')d.shift=0;else{const want=b.dataset.shift==='sat'?6:0;const t=localParts(Date.now());let add=(want-t.wd+7)%7;
      const target=Date.UTC(t.y,t.m,t.d+add,10,0)-330*60000;d.shift=target-Date.now()}
    c.save(d);await refreshStatus();toast(b.dataset.shift==='real'?'Real time':'Pretending: '+niceMs(nowMs()))});
  const seed=$('#seed');if(seed)seed.onclick=async()=>{const c=await loadDemo(),d=c.load();d.T=d.T||{};
    const names=['Kamal Perera','Nadeesha Silva','Tharindu Jayasinghe','Ishara Fernando','Sahan Wickramasinghe','Dilini Gunawardena','Ravindu Senanayake','Hiruni Dissanayake','Chamod Bandara','Sanduni Rathnayake','Pasindu Herath','Amaya Karunaratne','Yasiru Weerasinghe','Kavindi Abeysekara'];
    const now=Date.now()+(d.shift||0),t=localParts(now),back=(t.wd-6+7)%7||7,sats=[];
    for(let i=6;i>=1;i--){const ms=Date.UTC(t.y,t.m,t.d-back-(i-1)*7,4,0);const x=new Date(ms);sats.push(x.getUTCFullYear()+'-'+p2(x.getUTCMonth()+1)+'-'+p2(x.getUTCDate()))}
    d.T.students=names.map((n,i)=>({id:'CS-'+p2(i+1).padStart(3,'0'),name:n,added:sats[0],source:'admin',active:'yes'}));
    d.T.days=sats.map(x=>({date:x,status:'held',note:''}));d.T.attendance=[];d.T.excuses=[];
    const rate=[1,.95,.9,.85,.8,.75,.7,.68,.6,.5,.9,.83,.66,.4];
    d.T.students.forEach((s,i)=>sats.forEach((x,j)=>{const h=SHA.hash([i,j,7])[0]/255;if(h<rate[i])d.T.attendance.push({date:x,id:s.id,name:s.name,time:'09:'+p2(Math.floor(h*55)),device:randHex(12),method:'qr',note:''});
      else if(h>.92||i===7)d.T.excuses.push({date:x,id:s.id,reason:'Informed in advance',added:x})}));
    c.save(d);DATA=null;toast('Sample class added')};
}

/* ---------- routing ---------- */
function route(){
  const h=location.hash;
  if(h==='#admin'||h==='#setup'){showAdmin();if(!SID&&h==='#admin'){}}
  else{stopLive();$('#adminView').hidden=true;$('#studentView').hidden=false;startStudent()}
}
window.addEventListener('hashchange',route);
$('#demoBar').hidden=!isDemo();
if(location.hash==='#admin'||location.hash==='#setup')refreshStatus();
route();
</script>
</body>
</html>
