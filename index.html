<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Security Class</title>
<meta name="description" content="American Corner Matara: 12-week Cyber Security class. Open any session's slides.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#002868;--red:#BF0A30;--ink:#0b1630;--muted:#5a6478;--line:#e3e7ee;--bg:#ffffff;--card:#ffffff;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
a{color:inherit}
/* corner stripes + stars, behind content */
.deco{position:absolute;top:0;left:0;right:0;height:560px;pointer-events:none;z-index:0;overflow:hidden}
.stripes{position:absolute;top:-12vmin;left:-12vmin;width:46vmin;height:46vmin;transform:rotate(-45deg);display:grid;gap:2.2vmin;align-content:center;opacity:.9}
.stripes i{display:block;height:2.2vmin;background:var(--red);transform-origin:left;animation:grow 1.4s var(--ease) both}
.stripes i:nth-child(2){animation-delay:.12s}.stripes i:nth-child(3){animation-delay:.24s}.stripes i:nth-child(4){animation-delay:.36s}
.stars{position:absolute;right:max(16px,calc(50% - 574px));top:170px;width:min(26vw,300px);display:grid;grid-template-columns:repeat(5,1fr);gap:1.4vmin;opacity:.14}
.stars svg{width:100%;height:auto;fill:var(--navy);animation:fade 2.4s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,48px) 16px 64px}
.brand{display:flex;justify-content:flex-end;align-items:center;gap:clamp(10px,2vw,22px);animation:fade .8s ease both}
.brand svg,.brand img{height:clamp(34px,5vw,56px);width:auto;display:block}
.brand img{border-radius:6px}
.brand svg{box-shadow:0 1px 3px rgba(0,0,0,.15)}
header{margin:clamp(28px,6vw,64px) 0 clamp(28px,5vw,48px);animation:up .9s var(--ease) both}
.kicker{font-family:'Outfit';font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-size:clamp(.85rem,1.4vw,1.05rem)}
h1{font-family:'Outfit';font-weight:700;color:var(--navy);font-size:clamp(2.6rem,8vw,5.6rem);line-height:1;margin:.3em 0 .25em;letter-spacing:-.02em}
h1 span{color:var(--red)}
.sub{font-size:clamp(1.05rem,2vw,1.4rem);color:var(--muted)}
h2{font-family:'Outfit';font-weight:600;font-size:clamp(1.2rem,2.4vw,1.6rem);color:var(--navy);margin:0 0 18px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:clamp(14px,2vw,24px);margin-bottom:clamp(36px,6vw,56px)}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:clamp(20px,2.6vw,30px);border:1px solid var(--line);border-radius:18px;background:var(--card);text-decoration:none;overflow:hidden;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s;animation:up .8s var(--ease) both}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--navy);transition:width .35s var(--ease)}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,40,104,.14);border-color:#c9d2e2;outline:none}
a.card:hover::before,a.card:focus-visible::before{width:10px;background:var(--red)}
.num{font-family:'Outfit';font-weight:700;font-size:clamp(2.4rem,4.4vw,3.4rem);line-height:1;color:var(--red)}
.card h3{font-family:'Outfit';font-weight:600;font-size:clamp(1.35rem,2.4vw,1.75rem);line-height:1.15;color:var(--navy)}
.card p{color:var(--muted);font-size:1.02rem;line-height:1.45}
.meta{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:.95rem;color:var(--muted)}
.go{font-family:'Outfit';font-weight:600;color:var(--navy);display:inline-flex;align-items:center;gap:6px}
.go svg{width:20px;height:20px;transition:transform .35s var(--ease)}
a.card:hover .go svg{transform:translateX(4px)}
.card.soon{background:#fafbfd;border-style:dashed}
.card.soon::before{background:#c9d2e2}
.card.soon .num{color:#b8c1d1}
.card.soon h3{color:#5a6478}
.tag{font-family:'Outfit';font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:#8a94a8}
footer{color:var(--muted);font-size:.95rem;text-align:center;border-top:1px solid var(--line);padding-top:24px}
@media (max-width:820px){.stars{display:none}}
@media (max-width:600px){.stripes{width:30vmin;height:30vmin;top:-9vmin;left:-9vmin;gap:1.6vmin}.stripes i{height:1.6vmin}header{margin-top:56px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function usFlag(){
  const W=1.9,H=1,cw=.76,ch=.5385;
  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="United States flag">';
  for(let i=0;i<13;i++)s+='<rect x="0" y="'+(i/13)+'" width="'+W+'" height="'+(1/13+.001)+'" fill="'+(i%2?'#ffffff':'#bf0a30')+'"/>';
  s+='<rect width="'+cw+'" height="'+ch+'" fill="#002868"/>';
  const star=(cx,cy,r)=>{let p=[];for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.382:r;p.push((cx+rr*Math.cos(a)).toFixed(4)+','+(cy+rr*Math.sin(a)).toFixed(4));}return '<polygon points="'+p.join(' ')+'" fill="#fff"/>';};
  for(let row=0;row<9;row++)for(let j=0;j<11;j++){if((row%2===0&&j%2===0)||(row%2===1&&j%2===1))s+=star(.063*(j+1),.054*(row+1),.0308);}
  return s+'</svg>';
}
document.getElementById('brand').innerHTML=usFlag()+
  '<img alt="United States Embassy Sri Lanka seal" src="'+EMB_IMG+'">'+
  '<img alt="American Corner Matara logo" src="'+ACM_IMG+'">';
const starSVG='<svg viewBox="0 0 24 24"><polygon points="12,1 14.6,8.6 22.5,8.6 16.1,13.3 18.5,21 12,16.3 5.5,21 7.9,13.3 1.5,8.6 9.4,8.6"/></svg>';
document.getElementById('stars').innerHTML=Array.from({length:15},(_,i)=>starSVG.replace('<svg','<svg style="animation-delay:'+(i*.08)+'s"')).join('');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
let d=0;
SESSIONS.forEach(s=>{
  const ready=!!s.file, el=document.createElement(ready?'a':'div');
  el.className='card'+(ready?'':' soon');
  el.style.animationDelay=(.15+(d++)*.06)+'s';
  if(ready)el.href=encodeURI(s.file);
  el.innerHTML='<div class="num">'+String(s.n).padStart(2,'0')+'</div><h3>'+esc(s.title)+'</h3><p>'+esc(s.desc)+'</p>'+
    '<div class="meta">'+(ready?'<span>'+(s.slides?s.slides+' slides':'')+'</span><span class="go">Open'+arrow+'</span>':'<span class="tag">Coming soon</span>')+'</div>';
  document.getElementById(ready?'ready':'soon').appendChild(el);
});
